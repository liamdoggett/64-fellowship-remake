<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Set New Password | The 6:4 Fellowship</title>
    <meta name="description" content="Choose a new password for your 6:4 Fellowship account." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,450;9..144,550;9..144,700&family=Outfit:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body>
    <header class="site-header site-header--solid">
      <div class="container nav-inner">
        <a class="brand" href="index.html" aria-label="The 6:4 Fellowship home">
          <img class="brand__logo" src="assets/logo.png" alt="The 6:4 Fellowship" width="315" height="60" />
        </a>
                <nav class="nav-links" aria-label="Primary">
          <a href="about.html">About</a>
          <a href="library.html">Library</a>
          <a href="resources.html">Resources</a>
          <a href="store.html">Store</a>
          <a href="events.html">Events</a>
          <a href="coaching.html">Coaching</a>
          <a href="donate.html">Donate</a>
          <a href="contact.html">Contact</a>
          <a href="login.html">Login</a>
          <a class="nav-cta" href="join.html">Join for Free</a>
        </nav>
      </div>
    </header>

    <main class="auth-page">
      <section class="auth-shell">
        <div class="auth-panel reveal is-visible">
          <p class="eyebrow">Account recovery</p>
          <h1 class="display auth-panel__title">Choose a new password</h1>
          <p class="auth-panel__lede">Enter a new password for your member account.</p>

          <form class="form form--login" action="#" method="post" id="reset-form">
            <label>
              New password
              <input
                type="password"
                name="password"
                required
                minlength="8"
                autocomplete="new-password"
              />
            </label>
            <label>
              Confirm password
              <input
                type="password"
                name="confirm"
                required
                minlength="8"
                autocomplete="new-password"
              />
            </label>
            <button class="btn btn--primary" type="submit">Update Password</button>
            <p class="form-note">Open this page from the reset link in your email.</p>
          </form>
        </div>
      </section>
    </main>

    <script type="module" src="js/reset-password.js"></script>
  </body>
</html>
